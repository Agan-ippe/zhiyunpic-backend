# 公共配置文件
spring:
  main:
    #    解决升级Spring Boot2.6后,因依赖循环引用导致启动时报错的问题
    allow-circular-references: true
  application:
    name: zhiyunpic
  # 默认 dev 环境
  profiles:
    active: dev
  # 支持 swagger3
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  # session 配置
  session:
    # todo 取消注释开启分布式 session（须先配置 Redis）
    # store-type: redis
    # 30 天过期
    timeout: 2592000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    #    指定日志实现类为 StdOutImpl，即标准输出实现
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）

# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: "知云图库接口文档"
    version: v1.0
    description: "这只是一个接口文档"
#    email: "wjy7136@163.com"
    concat: "<a href='https://github.com/Agan-ippe'>知莫</a>    wjy7136@163.com"
#    url: https://docs.xiaominfo.com
    license: Apache 2.0
#    license-url: https://stackoverflow.com/
#    terms-of-service-url: https://stackoverflow.com/
    group:
      default:
        group-name: "默认分组"
        api-rule: package
        api-rule-resources:
          - com.zhimo.zhiyunpic.controller
